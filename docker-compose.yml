# Local development database only. Bound to 127.0.0.1 and seeded with
# throwaway credentials. Production uses docker-compose.prod.yml, where
# every secret comes from .env.prod.
#
# Both the project name and the volume name are pinned. Pinning the project
# alone is not enough: compose prefixes volume names with it, so `redlist-dev`
# yielded a brand-new empty redlist-dev_pgdata and stranded the real data in
# befree_pgdata. The volume is named explicitly below for that reason.
name: redlist-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ben
      POSTGRES_PASSWORD: ben_free
      POSTGRES_DB: befree
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    name: befree_pgdata
