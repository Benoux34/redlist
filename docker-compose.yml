# Local development database only. Bound to 127.0.0.1 and seeded with
# throwaway credentials. Production uses docker-compose.prod.yml, where
# every secret comes from .env.prod.
#
# The project name is pinned: compose otherwise derives it from the directory,
# so renaming the folder would silently point db:up at a brand-new empty volume
# instead of the existing befree_pgdata.
name: redlist-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ben
      POSTGRES_PASSWORD: ben_free
      POSTGRES_DB: befree
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
