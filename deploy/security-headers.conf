# nginx drops inherited add_header directives as soon as a deeper block defines
# its own, so this is included in every location that sets cache headers rather
# than relying on inheritance from the server block.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;

# img-src stays broad because species photos come from third-party hosts that
# change over time (iNaturalist S3/CDN, upload.wikimedia.org) and map tiles from
# basemaps.cartocdn.com. Tighten it to that host list if you would rather have a
# broken image than a permissive directive.
#
# Umami (analytics) is served from one host and posts events to another:
# the tag loads cloud.umami.is/script.js, which beacons to
# gateway.umami.is/api/send. Both are needed, in the matching directive --
# listing only cloud.umami.is silently drops every event.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cloud.umami.is; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://gateway.umami.is; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
