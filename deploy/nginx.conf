# Serves the built SPA and proxies /api to the Bun API on the same origin.
# Same-origin is what keeps the SameSite=Lax session cookie first-party: a
# cross-site XHR would not carry it at all.

# The container is only reachable through the host's TLS proxy, so the socket
# address is always the Docker gateway. Recover the real client IP from the
# header that proxy sets, and accept it only from private ranges — this is what
# makes the API's rate limiting keyed on something the client cannot forge.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;
real_ip_recursive on;

# Link-preview crawlers do not execute JavaScript, so the SPA shell hands them
# the same generic <title> for all 50k species. These are routed to the API,
# which renders the real Open Graph tags. Every other visitor gets the SPA.
map $http_user_agent $is_crawler {
    default 0;
    "~*(facebookexternalhit|Twitterbot|WhatsApp|LinkedInBot|Slackbot|Discordbot|TelegramBot|Pinterest|redditbot|Googlebot|bingbot|Applebot|SkypeUriPreview|vkShare|embedly|Iframely|Mastodon|Bluesky)" 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64k;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Overwrites anything the client sent under this name.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://api:3000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Set in one directive: `expires` would emit a second Cache-Control.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # A regex location outranks the `location /` prefix below, so species URLs
    # land here first. `rewrite ... last` inside `if` is one of the few
    # operations nginx documents as safe in a location context.
    location ~ ^/species/[0-9]+$ {
        if ($is_crawler) {
            rewrite ^/species/([0-9]+)$ /__preview/$1 last;
        }

        try_files $uri /index.html;
    }

    # internal: only reachable through the rewrite above, never from outside.
    location ^~ /__preview/ {
        internal;

        proxy_pass http://api:3000/api/red-list/preview/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location ~ ^/sitemap-species-([0-9]+)\.xml$ {
        proxy_pass http://api:3000/api/red-list/sitemap-species/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ ^/(sitemap(?:-pages|-countries)?\.xml)$ {
        proxy_pass http://api:3000/api/red-list/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
