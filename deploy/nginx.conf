# Serves the built SPA and proxies /api to the Bun API on the same origin.
# Same-origin is what keeps the SameSite=Lax session cookie first-party: a
# cross-site XHR would not carry it at all.

# The container is only reachable through the host's TLS proxy, so the socket
# address is always the Docker gateway. Recover the real client IP from the
# header that proxy sets, and accept it only from private ranges — this is what
# makes the API's rate limiting keyed on something the client cannot forge.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64k;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Overwrites anything the client sent under this name.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://api:3000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Set in one directive: `expires` would emit a second Cache-Control.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
