name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bunx prisma generate
        working-directory: apps/api

      - run: bunx tsc --noEmit -p packages/contracts/tsconfig.json
      - run: bunx tsc --noEmit -p apps/api/tsconfig.json
      - run: bunx tsc --noEmit -p apps/web/tsconfig.json
      - run: bunx tsc --noEmit

      - run: bunx oxlint --type-aware

      - run: bun test

      - name: Apply migrations
        run: bunx prisma migrate deploy
        working-directory: apps/api

      # --exit-code returns 2 when the applied migrations drift from the schema.
      - name: Check migrations match the schema
        run: |
          bunx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema \
            --exit-code
        working-directory: apps/api

      - run: bun run build
        working-directory: apps/web

  images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
