# Production stack for a single VPS.
#
# Nothing is published on a public interface: the web container is bound to
# 127.0.0.1 and the host's TLS terminator (see deploy/nginx-host.conf.example)
# is what faces the internet.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

# Pinned so the production stack never shares containers or volumes with the
# local development database.
name: redlist-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WEB_ORIGIN: ${WEB_ORIGIN}
      TRUST_PROXY: "true"
      IUCN_API_TOKEN: ${IUCN_API_TOKEN}
      IUCN_API_BASE_URL: ${IUCN_API_BASE_URL}
      IUCN_CONTACT_EMAIL: ${IUCN_CONTACT_EMAIL}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e 'const r = await fetch(\"http://127.0.0.1:3000/health\"); process.exit(r.ok ? 0 : 1)'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
